apiVersion: apps/v1
kind: Deployment
metadata:
  name: pangolin-gateway-controller
  namespace: pangolin-system
  labels:
    app.kubernetes.io/name: pangolin-gateway-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pangolin-gateway-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pangolin-gateway-controller
    spec:
      serviceAccountName: pangolin-gateway-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/envisia/pangolin-gateway-controller:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            # --- required ---
            - name: CONFIG_ENDPOINT
              value: "http://pangolin.pangolin-system.svc.cluster.local:8081/api/v1/traefik-config"
            - name: CONFIG_NAMESPACE
              value: "pangolin-system"
            - name: CONFIG_PARENT_GATEWAY
              value: "eg"
            # --- optional ---
            - name: CONFIG_PARENT_GATEWAY_NAMESPACE
              value: "envoy-gateway-system"
            - name: CONFIG_LISTENERSET_NAME
              value: "pangolin"
            - name: CONFIG_POLL_INTERVAL
              value: "30s"
            - name: CONFIG_ENABLE_HTTPS_LISTENERS
              value: "true"
            - name: CONFIG_TLS_SECRET_TEMPLATE
              value: "{hostname-dashed}-tls"
            # Backend strategy. `envoy-backend` (the default) emits Envoy
            # Gateway `Backend` CRDs for IP/FQDN targets; set to `service` for
            # non-Envoy Gateway API implementations (loses FQDN support).
            - name: CONFIG_BACKEND_KIND
              value: "envoy-backend"
            # Raw TCP/UDP resources -> TCPRoute/UDPRoute. Requires the Gateway
            # API *experimental channel* CRDs and an Envoy Gateway version that
            # reconciles the graduated ListenerSet kind. UDP additionally needs
            # a cloud LB that supports mixed TCP/UDP protocol Services.
            - name: CONFIG_ENABLE_TCP_ROUTES
              value: "true"
            - name: CONFIG_ENABLE_UDP_ROUTES
              value: "false"
            # --- authentication for badger-protected resources ---
            # Pangolin attaches its `badger` auth plugin to every resource
            # router. Envoy can't run Traefik plugins, so protected routers are
            # SKIPPED unless one of the following is configured:
            #
            # (a) An ext-authz service speaking Envoy's HTTP external
            #     authorization protocol that verifies pangolin sessions. The
            #     controller then emits a SecurityPolicy per protected route:
            # - name: CONFIG_EXT_AUTHZ_SERVICE
            #   value: "pangolin-badger-shim"
            # - name: CONFIG_EXT_AUTHZ_PORT
            #   value: "9001"
            # - name: CONFIG_EXT_AUTHZ_PATH
            #   value: "/verify"
            #
            # (b) The dangerous escape hatch: expose protected resources
            #     WITHOUT authentication. Only for setups where every pangolin
            #     resource is intentionally public:
            # - name: CONFIG_ALLOW_UNAUTHENTICATED_ROUTES
            #   value: "true"
            # cert-manager wiring (optional). Annotations are forwarded as-is to the
            # objects the controller creates; cert-manager's gateway-shim then mints
            # the Secret referenced by the template above.
            # - name: CONFIG_HTTPROUTE_ANNOTATIONS
            #   value: "cert-manager.io/cluster-issuer=letsencrypt-prod"
            # - name: CONFIG_LISTENERSET_ANNOTATIONS
            #   value: "cert-manager.io/cluster-issuer=letsencrypt-prod"
            - name: RUST_LOG
              value: "info,pangolin_gateway_controller=info"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
