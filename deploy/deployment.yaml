apiVersion: apps/v1
kind: Deployment
metadata:
  name: pangolin-gateway-controller
  namespace: pangolin-system
  labels:
    app.kubernetes.io/name: pangolin-gateway-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pangolin-gateway-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pangolin-gateway-controller
    spec:
      serviceAccountName: pangolin-gateway-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/envisia/pangolin-gateway-controller:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            # --- required ---
            - name: CONFIG_ENDPOINT
              value: "http://pangolin.pangolin-system.svc.cluster.local:8081/api/v1/traefik-config"
            - name: CONFIG_NAMESPACE
              value: "pangolin-system"
            - name: CONFIG_PARENT_GATEWAY
              value: "eg"
            # --- optional ---
            - name: CONFIG_PARENT_GATEWAY_NAMESPACE
              value: "envoy-gateway-system"
            - name: CONFIG_LISTENERSET_NAME
              value: "pangolin"
            - name: CONFIG_POLL_INTERVAL
              value: "30s"
            - name: CONFIG_ENABLE_HTTPS_LISTENERS
              value: "true"
            - name: CONFIG_TLS_SECRET_TEMPLATE
              value: "{hostname-dashed}-tls"
            # cert-manager wiring (optional). Annotations are forwarded as-is to the
            # objects the controller creates; cert-manager's gateway-shim then mints
            # the Secret referenced by the template above.
            # - name: CONFIG_HTTPROUTE_ANNOTATIONS
            #   value: "cert-manager.io/cluster-issuer=letsencrypt-prod"
            # - name: CONFIG_LISTENERSET_ANNOTATIONS
            #   value: "cert-manager.io/cluster-issuer=letsencrypt-prod"
            # Badger ext_authz (optional). Point this at an Envoy ext_auth-compatible
            # shim for pangolin's /api/v1/badger/verify-session protocol.
            # - name: CONFIG_BADGER_EXT_AUTH
            #   value: "true"
            # - name: CONFIG_BADGER_EXT_AUTH_BACKEND_NAME
            #   value: "pangolin-badger-ext-authz"
            # - name: CONFIG_BADGER_EXT_AUTH_BACKEND_PORT
            #   value: "9002"
            # Test-mode reconcile scope (optional), e.g. only one generated route.
            # - name: CONFIG_RECONCILE_ONLY
            #   value: "HTTPRoute/hr-9-chris-connect-router"
            # Pangolin dashboard through Gateway API (optional).
            # - name: CONFIG_PANGOLIN_DASHBOARD_HOST
            #   value: "pangolin.example.com"
            # Gerbil UDP through Gateway API (optional; requires UDPRoute support).
            # - name: CONFIG_GERBIL_UDP_ROUTE
            #   value: "true"
            - name: RUST_LOG
              value: "info,pangolin_gateway_controller=info"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
