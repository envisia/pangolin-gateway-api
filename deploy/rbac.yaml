apiVersion: v1
kind: ServiceAccount
metadata:
  name: pangolin-envoy-controller
  namespace: pangolin-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pangolin-envoy-controller
rules:
  # Gateway API objects we own.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "listenersets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes/status", "listenersets/status"]
    verbs: ["get"]
  # Core resources we synthesize for IP-backed pangolin targets.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read existing Gateways so we can reference one as parent.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "gatewayclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pangolin-envoy-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pangolin-envoy-controller
subjects:
  - kind: ServiceAccount
    name: pangolin-envoy-controller
    namespace: pangolin-system
