apiVersion: v1
kind: ServiceAccount
metadata:
  name: pangolin-gateway-controller
  namespace: pangolin-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pangolin-gateway-controller
rules:
  # Gateway API objects we own. tcproutes/udproutes are only touched when
  # CONFIG_ENABLE_TCP_ROUTES / CONFIG_ENABLE_UDP_ROUTES are set, but granting
  # them unconditionally is safe — RBAC checks happen lazily.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "listenersets", "tcproutes", "udproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      [
        "httproutes/status",
        "listenersets/status",
        "tcproutes/status",
        "udproutes/status",
      ]
    verbs: ["get"]
  # Core resources we synthesize for IP-backed pangolin targets.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read existing Gateways so we can reference one as parent.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "gatewayclasses"]
    verbs: ["get", "list", "watch"]
  # Envoy Gateway CRDs. Backend is used when CONFIG_BACKEND_KIND=envoy-backend
  # (the default); SecurityPolicy when CONFIG_EXT_AUTHZ_SERVICE is set. Safe to
  # leave granted even when unused — RBAC checks happen lazily.
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["backends", "securitypolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pangolin-gateway-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pangolin-gateway-controller
subjects:
  - kind: ServiceAccount
    name: pangolin-gateway-controller
    namespace: pangolin-system
